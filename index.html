<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard Power BI - Proveedores</title>

  <style>
    /* 🎨 Estilos generales */
    :root {
      --primary: #f2c811;
      --secondary: #111;
      --background: #f9fafc;
      --text: #333;
      --card-bg: #fff;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      background-color: var(--background);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* 🧭 Encabezado */
    header {
      width: 100%;
      background: linear-gradient(90deg, var(--primary), #ffdd44);
      color: var(--secondary);
      text-align: center;
      padding: 25px 10px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    header img {
      height: 70px;
      display: block;
      margin: 0 auto 10px;
    }

    header h1 {
      font-size: 1.8em;
      margin: 0;
    }

    /* 💡 Contenedor principal */
    main {
      width: 100%;
      max-width: 1200px;
      background: var(--card-bg);
      border-radius: 16px;
      margin: 30px;
      padding: 20px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
      text-align: center;
      transition: transform 0.2s ease-in-out;
    }

    main:hover {
      transform: translateY(-3px);
    }

    iframe {
      width: 100%;
      height: 650px;
      border: none;
      border-radius: 10px;
      margin-top: 10px;
    }

    /* 🦶 Pie de página */
    footer {
      width: 100%;
      background-color: var(--secondary);
      color: white;
      text-align: center;
      padding: 20px;
      font-size: 0.95em;
    }

    footer a {
      color: var(--primary);
      text-decoration: none;
      font-weight: bold;
      transition: color 0.3s;
    }

    footer a:hover {
      color: #ffde5c;
    }

    /* 📱 Responsividad */
    @media (max-width: 768px) {
      header h1 {
        font-size: 1.3em;
      }

      main {
        width: 90%;
        margin: 15px;
        padding: 15px;
      }

      iframe {
        height: 450px;
      }
    }

  </style>
</head>

<body>
  <header>
    <img src="https://upload.wikimedia.org/wikipedia/commons/c/cf/New_Power_BI_Logo.svg" alt="Power BI Logo">
    <h1>📊 Dashboard Power BI: Análisis de Proveedores</h1>
  </header>

  <main>
    <h2>Visualización interactiva de datos</h2>
    <p>Explora las métricas clave sobre proveedores y productos en este panel desarrollado con Power BI.</p>
    
    <iframe
      title="Dashboard Power BI"
      src="https://app.powerbi.com/view?r=eyJrIjoiNTgxMWY4NDktMjlkZi00NmNkLThkMDQtZjVjMzIyNmI2NDI4IiwidCI6IjRiZjM4ZWEyLTgzMmQtNDU1Mi1iNTA4LTQyMTU3MGRhNDNmZiIsImMiOjR9"
      allowfullscreen="true">
    </iframe>
  </main>

  <footer>
    Creado por <a href="https://vercel.com" target="_blank">Maria Gallo</a> — Publicado en Vercel 🚀
  </footer>
</body>
</html>
