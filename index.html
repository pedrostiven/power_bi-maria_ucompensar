<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard Power BI - Proveedores</title>

  <style>
    /* Fondo con degradado animado */
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(-45deg, #f4f6f8, #e8efff, #d1e0ff, #ffffff);
      background-size: 400% 400%;
      animation: gradientMove 12s ease infinite;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    @keyframes gradientMove {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    header img {
      width: 60px;
      height: 60px;
    }

    header h1 {
      font-size: 1.8rem;
      color: #1f4e79;
      font-weight: 700;
      text-align: center;
    }

    iframe {
      width: 90%;
      height: 80vh;
      border: none;
      border-radius: 16px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    iframe:hover {
      transform: scale(1.01);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.25);
    }

    footer {
      margin-top: 20px;
      font-size: 0.9rem;
      color: #555;
    }

    footer a {
      color: #1f4e79;
      text-decoration: none;
      font-weight: bold;
    }

    footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>
  <header>
    <img src="https://upload.wikimedia.org/wikipedia/commons/c/cf/New_Power_BI_Logo.svg" alt="Power BI Logo">
    <h1>📊 Dashboard Power BI: Proveedores y Productos</h1>
  </header>

  <iframe
    title="Dashboard Power BI"
    src="https://app.powerbi.com/view?r=eyJrIjoiNTgxMWY4NDktMjlkZi00NmNkLThkMDQtZjVjMzIyNmI2NDI4IiwidCI6IjRiZjM4ZWEyLTgzMmQtNDU1Mi1iNTA4LTQyMTU3MGRhNDNmZiIsImMiOjR9"
    allowfullscreen="true">
  </iframe>

  <footer>
    Creado por <a href="https://vercel.com" target="_blank">Maria Gallo</a> — Publicado en Vercel 🚀
  </footer>
</body>
</html>
